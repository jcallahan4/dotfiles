
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pinned rule set so lint results don't change when ruff's defaults do.
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]  # formatter owns line length

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ---- uv notes -------------------------------------------------------------
# Add packages with `uv add <pkg>` (or `uv add --dev <pkg>` for tools), run
# with `uv run ...`. For CUDA-specific PyTorch wheels, uncomment and pick the
# index for your CUDA version (see https://docs.astral.sh/uv/guides/integration/pytorch/):
#
# [tool.uv.sources]
# torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
# torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
#
# [[tool.uv.index]]
# name = "pytorch-cu128"
# url = "https://download.pytorch.org/whl/cu128"
# explicit = true
