[general]
import = [
  "~/.config/alacritty/themes/themes/monokai_pro.toml"
]

[env]
TERM = "xterm-256color"

[window]
decorations = "Buttonless"
opacity = 0.8
blur = true
option_as_alt = "Both"

  [window.padding]
  x = 10
  y = 10

[font]
size = 15

  [font.normal]
  family = "MesloLGS Nerd Font Mono"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
