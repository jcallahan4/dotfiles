# tmux config. Linked to ~/.config/tmux/tmux.conf by install.sh.
# Prefix is Ctrl-Space: both thumbs, no pinky stretch, unused by zsh/nvim/codex.
# (Tip: on a VIA keyboard, map a layer key to emit Ctrl-Space so it's one chord.
# If macOS has more than one input source, disable its Ctrl-Space shortcut in
# System Settings > Keyboard > Keyboard Shortcuts > Input Sources.)

set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Terminal: Ghostty is truecolor and speaks the kitty keyboard protocol.
# extended-keys pass Shift+Enter etc. through to Codex / Claude Code / nvim.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g focus-events on          # nvim autoread / gitsigns refresh
set -sg escape-time 10          # no lag leaving insert mode in nvim
set -g history-limit 100000
set -g mouse on                 # click panes, drag to resize, scroll
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g allow-passthrough on     # image protocols through tmux

# Splits and navigation, vim style. | and - split; hjkl move; HJKL resize.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind z resize-pane -Z           # "zen": zoom current pane, again to unzoom
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Sessions: one per project (see the `nic` function in zsh/zshrc_common).
# Prefix then Space is a quick session switcher too (choose-tree below is on s).
bind s choose-tree -Zs          # pick a session
bind -r ( switch-client -p
bind -r ) switch-client -n

# Copy mode with vi keys; y copies to the macOS clipboard.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Status line: minimal, matches the coolnight palette.
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=#CBE0F0"
set -g status-left "#[fg=#47FF9C,bold] #S #[fg=#214969]│ "
set -g status-left-length 30
set -g status-right "#[fg=#214969]│#[fg=#CBE0F0] %a %b %d  %H:%M "
setw -g window-status-format "#[fg=#214969] #I:#W "
setw -g window-status-current-format "#[fg=#0FC5ED,bold] #I:#W "
set -g pane-border-style "fg=#214969"
set -g pane-active-border-style "fg=#47FF9C"
set -g message-style "bg=#033259,fg=#CBE0F0"
