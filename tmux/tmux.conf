# tmux config. Linked to ~/.config/tmux/tmux.conf by install.sh.
# Prefix is F12: no program binds it, macOS doesn't either (F11 is Show
# Desktop, so not that), and the VIA keyboard maps FN+Space to send F12 so the
# prefix is one chord. Ctrl-Space is a second prefix for the built-in keyboard.
# (If macOS has more than one input source, disable its Ctrl-Space shortcut in
# System Settings > Keyboard > Keyboard Shortcuts > Input Sources.)

set -g prefix F12
set -g prefix2 C-Space
unbind C-b
bind F12 send-prefix
bind C-Space send-prefix -2

# Terminal: Ghostty is truecolor and speaks the kitty keyboard protocol.
# extended-keys pass Shift+Enter etc. through to Codex / Claude Code / nvim.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g focus-events on          # nvim autoread / gitsigns refresh
set -sg escape-time 10          # no lag leaving insert mode in nvim
set -g history-limit 100000
set -g mouse on                 # click panes, drag to resize, scroll
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g allow-passthrough on     # image protocols through tmux

# Ctrl-D quits the Codex TUI, and Jake's FN+D dictation chord is easy to mistype as
# Ctrl-D. Swallow Ctrl-D in panes running codex; pass it through everywhere else
# (nvim uses it for half-page scroll; zsh ignores it via ignore_eof).
bind -n C-d if -F '#{==:#{pane_current_command},codex}' { display-message "Ctrl-D ignored in Codex (use /quit to exit)" } { send-keys C-d }

# Splits and navigation, vim style. | and - split; hjkl move; HJKL resize.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind z resize-pane -Z           # "zen": zoom current pane, again to unzoom
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Sessions: one per project (see the `nic` function in zsh/zshrc_common).
# Prefix then Space is a quick session switcher too (choose-tree below is on s).
bind s choose-tree -Zs          # pick a session
bind -r ( switch-client -p
bind -r ) switch-client -n

# Copy mode behaves like a plain terminal's scrollback: scroll up (wheel, arrows,
# PageUp/PageDown) to read, and the moment you type, tmux leaves copy mode and the
# keystroke goes to the program, so you can read history while composing a reply to
# Codex. Select with a mouse drag (or Shift+arrows), Enter copies the selection to the
# clipboard; with nothing selected Enter is passed through. Escape leaves without typing.
# The emacs table is used because it binds far fewer plain letters than the vi table.
setw -g mode-keys emacs
unbind -T copy-mode F
unbind -T copy-mode N
unbind -T copy-mode P
unbind -T copy-mode R
unbind -T copy-mode T
unbind -T copy-mode X
unbind -T copy-mode f
unbind -T copy-mode g
unbind -T copy-mode n
unbind -T copy-mode q
unbind -T copy-mode r
unbind -T copy-mode t
unbind -T copy-mode Space
bind -T copy-mode Any { send-keys -X cancel; send-keys }
bind -T copy-mode Enter if -F '#{selection_present}' { send-keys -X copy-pipe-and-cancel "pbcopy" } { send-keys -X cancel; send-keys }
bind -T copy-mode Escape send-keys -X cancel
bind -T copy-mode S-Up    send-keys -X begin-selection \; send-keys -X cursor-up
bind -T copy-mode S-Down  send-keys -X begin-selection \; send-keys -X cursor-down
bind -T copy-mode S-Left  send-keys -X begin-selection \; send-keys -X cursor-left
bind -T copy-mode S-Right send-keys -X begin-selection \; send-keys -X cursor-right
bind -T copy-mode C-s     command-prompt -i -p "search up" { send-keys -X search-backward-incremental "%%" }

# Status line: minimal, matches the coolnight palette.
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=#CBE0F0"
set -g status-left "#[fg=#47FF9C,bold] #S #[fg=#214969]│ "
set -g status-left-length 30
set -g status-right "#[fg=#214969]│#[fg=#CBE0F0] %a %b %d  %H:%M "
setw -g window-status-format "#[fg=#214969] #I:#W "
setw -g window-status-current-format "#[fg=#0FC5ED,bold] #I:#W "
set -g pane-border-style "fg=#214969"
set -g pane-active-border-style "fg=#47FF9C"
set -g message-style "bg=#033259,fg=#CBE0F0"
